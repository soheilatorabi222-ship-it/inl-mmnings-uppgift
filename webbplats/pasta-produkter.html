<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasta – BUONITO</title>
    <style>

          body {

            margin: 0;

            background: white;

            font-family: Arial, sans-serif;

            color: #294b38;

          }
          .pasta-grid {
       display: grid;
       grid-template-columns: repeat(4, 1fr);
       gap: 15px;
       max-width: 1050px;
       margin: 35px auto;
       padding: 15px;
      }
      .pasta-kort {
       background: white;
       border: 1px solid #ddd;
       border-radius: 10px;
       padding: 15px;
       text-align: center;
      }
      .bildplats {
       background: #f5f5f5;
       height: 200px;
       display: flex;
       justify-content: center;
       align-items: center;
       margin-bottom: 15px;
      }
      .pasta-kort button {
       display: block;
       margin: 15px auto;
       padding: 12px;
       background: #294b38;
       color: white;
       border: none;
       border-radius: 7px;
       cursor: pointer;
      }
      @media (max-width: 700px) {
       .pasta-grid {
         grid-template-columns: repeat(2, 1fr);
       }
      }
      har snabbmeny
    </style>
  </head>
  <body>
    <h1>Pasta</h1>
    <div class="pasta-grid">
      <article class="pasta-kort">
        <div class="bildplats">Produktbild 1</div>
        <h2>Spaghetti</h2>
        <p>Italiensk spaghetti</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="pasta-kort">
        <div class="bildplats">Produktbild 2</div>
        <h2>Penne</h2>
        <p>Italiensk penne</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="pasta-kort">
        <div class="bildplats">Produktbild 3</div>
        <h2>Fusilli</h2>
        <p>Italiensk fusilli</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="pasta-kort">
        <div class="bildplats">Produktbild 4</div>
        <h2>Tagliatelle</h2>
        <p>Italiensk tagliatelle</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
    </div>
  </body>
</html>
