<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nötter – BUONITO</title>
    <style>
      body {
        margin: 0;

        background: white;

        font-family: Arial, sans-serif;

        color: #294b38;
      }
      .notter-grid {
        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 15px;

        max-width: 1050px;

        margin: 35px auto;

        padding: 15px;
      }

      .notter-kort {
        background: white;

        border: 1px solid #ddd;

        border-radius: 10px;

        padding: 15px;

        text-align: center;
      }

      .bildplats {
        background: #f5f5f5;

        height: 200px;

        display: flex;

        justify-content: center;

        align-items: center;
      }

      .notter-kort button {
        display: block;

        margin: 15px auto;

        padding: 12px;

        background: #294b38;

        color: white;

        border: none;

        border-radius: 7px;

        cursor: pointer;
      }

      @media (max-width: 700px) {
        .notter-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>Nötter</h1>
    <div class="notter-grid">
      <article class="notter-kort">
        <div class="bildplats">Produktbild 1</div>
        <h2>Pistagenötter</h2>
        <p>Italienska pistagenötter</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="notter-kort">
        <div class="bildplats">Produktbild 2</div>
        <h2>Mandlar</h2>
        <p>Italienska mandlar</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="notter-kort">
        <div class="bildplats">Produktbild 3</div>
        <h2>Hasselnötter</h2>
        <p>Italienska hasselnötter</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
      <article class="notter-kort">
        <div class="bildplats">Produktbild 4</div>
        <h2>Blandade nötter</h2>
        <p>Utvalda italienska nötter</p>
        <strong>Pris: -- kr</strong>
        <button type="button">Lägg i varukorg</button>
      </article>
    </div>
  </body>
</html>
